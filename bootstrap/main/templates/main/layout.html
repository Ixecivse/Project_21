<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'main/css/main.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
    <aside>
        <img src="{% static 'main/img/bootstrap_logo.png' %}" alt="Лого">
        <h3>Меню</h3>
        <ul>
            <a href="{% url 'home' %}"><li><i class="fa-solid fa-house"></i> Главная</li></a>
            <a href="{% url 'catalog' %}"><li><i class="fa-solid fa-book"></i> Каталог</li></a>
            <a href="{% url 'category' %}"><li><i class="fa-solid fa-list"></i> Категории</li></a>
            <a href="{% url 'contacts' %}"><li><i class="fa-solid fa-circle-user"></i> Контакты</li></a>
        </ul>

        <div class="user-panel">
            <div class="user-info">
                <div class="avatar-circle">
                    <img src="{% static 'main/img/avatar.jpg' %}" alt="Аватар" onerror="this.src='{% static 'main/img/default-avatar.png' %}'">
                </div>
                <span class="username">Пользователь</span>
                <div class="dropdown-trigger">
                    <i class="fas fa-chevron-down arrow-icon"></i>
                </div>
            </div>

            <div class="dropdown-menu">
                <a href="" class="dropdown-item">
                    <i class="fas fa-user"></i>
                    <span>Профиль</span>
                </a>х
                </a>
            </div>
        </div>
    </aside>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'main/js/main.js' %}"></script>
</body>
</html>
